name: Validate Flowboard

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci
      - name: Unit, syntax, static, asset-budget, and build checks
        run: npm run validate
      - name: Firestore Security Rules tests
        run: npm run test:rules
      - name: Install ephemeral browser test tools
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.55.0 lighthouse@12.8.2
          npx playwright install --with-deps chromium
      - name: Derive Pages base path
        run: echo "FLOWBOARD_BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      - name: Start Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > server.log 2>&1 &
          for i in {1..20}; do curl --fail --silent "http://127.0.0.1:4173${FLOWBOARD_BASE_PATH}" && exit 0; sleep 1; done
          cat server.log
          exit 1
      - name: Browser critical-workflow checks
        run: npx playwright test tests/board-first-copy.spec.mjs tests/cloud-first-configured-session.spec.mjs tests/cloud-first-a11y.spec.mjs tests/browser-smoke.spec.mjs tests/single-workspace-board-ux.spec.mjs --grep="cloud-first board|Filters stays bounded|configured signed-out build|board manager|retired recovery controls|account repair|New board is visible|archived owner board|streamlined chrome"
      - name: Blank-board and confirmation regressions
        run: npx playwright test tests/board-creation-confirmation.spec.mjs --reporter=line
      - name: Emulator-backed multi-user browser workflow
        run: |
          npm run dev -- --host 127.0.0.1 --port 4180 > emulator-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do curl --fail --silent "http://127.0.0.1:4180${FLOWBOARD_BASE_PATH}tests/emulator/index.html" >/dev/null && break; sleep 1; done
          curl --fail --silent "http://127.0.0.1:4180${FLOWBOARD_BASE_PATH}tests/emulator/index.html" >/dev/null
          export PLAYWRIGHT_EMULATOR_BASE_URL="http://127.0.0.1:4180${FLOWBOARD_BASE_PATH%/}"
          npx --yes firebase-tools@15.25.1 emulators:exec --only auth,firestore --project demo-flowboard-browser "npx playwright test tests/emulator/emulator-browser.spec.mjs tests/emulator/deletion-engine.spec.mjs --reporter=line --workers=1"
          npx --yes firebase-tools@15.25.1 emulators:exec --only auth,firestore --project demo-flowboard-browser "npx playwright test tests/emulator/board-lifecycle-ui.spec.mjs --reporter=line --workers=1"
      - name: Automated accessibility check
        run: |
          npx lighthouse "http://127.0.0.1:4173${FLOWBOARD_BASE_PATH}" --only-categories=accessibility --chrome-flags='--headless --no-sandbox' --output=json --output-path=lighthouse-report.json
          node scripts/assert-lighthouse.mjs
      - name: Archive diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validation-diagnostics
          path: |
            server.log
            lighthouse-report.json
            test-results/
          if-no-files-found: ignore
